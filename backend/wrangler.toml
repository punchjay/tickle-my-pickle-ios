name = "tickle-my-pickle-amenities"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Per-place cache of Claude's amenity answers. Create it with
#   npx wrangler kv namespace create AMENITIES
# and paste the returned id here.
[[kv_namespaces]]
binding = "AMENITIES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never committed):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put GOOGLE_PLACES_SERVER_KEY
